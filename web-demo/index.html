<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学术前沿知识导航</title>
<style>
  :root{
    --bg:#F7F7F5; --panel:#FFFFFF; --border:#E4E4E0; --border-2:#D2D2CD;
    --text:#1F1F1D; --muted:#6E6E68; --faint:#9A9A94;
    --accent:#185FA5; --accent-bg:#E6F1FB; --accent-line:#B5D4F4;
    --warn:#8A5300; --warn-bg:#FAEEDA; --err:#A32D2D; --err-bg:#FCEBEB;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:400 15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column;
  }
  a{color:var(--accent)}

  /* ---------- 顶部 ---------- */
  header{
    display:flex; align-items:center; gap:12px;
    padding:12px 18px; background:var(--panel);
    border-bottom:1px solid var(--border); flex:0 0 auto;
  }
  .brand{font-weight:500;font-size:16px;letter-spacing:-.01em}
  .sub{font-size:12px;color:var(--faint);margin-left:2px}
  header .spacer{flex:1}
  .status{
    font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;
    padding:3px 10px;border:1px solid var(--border);border-radius:999px;white-space:nowrap;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:0 0 auto}
  .dot.on{background:#0F6E56}
  .dot.off{background:var(--err)}
  .btn{
    font:400 13px/1 inherit; padding:7px 13px; border-radius:8px;
    border:1px solid var(--border-2); background:transparent; color:var(--text); cursor:pointer;
  }
  .btn:hover{background:#F0F0EC}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#14508C}

  /* ---------- 设置条 ---------- */
  #setup{
    display:none; padding:14px 18px; background:var(--warn-bg);
    border-bottom:1px solid #F0D9A8; font-size:13px; color:var(--warn);
  }
  #setup.show{display:block}
  #setup .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  #setup input{
    flex:1;min-width:220px;padding:8px 10px;border:1px solid #E5C78C;
    border-radius:8px;font:400 13px/1.4 inherit;background:#fff;color:var(--text)
  }

  /* ---------- 消息区 ---------- */
  main{flex:1;overflow-y:auto;padding:22px 18px 8px}
  .wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

  .msg{display:flex;gap:10px;align-items:flex-start}
  .msg.user{flex-direction:row-reverse}
  .bubble{
    max-width:88%; padding:11px 14px; border-radius:var(--radius);
    background:var(--panel); border:1px solid var(--border);
  }
  .msg.user .bubble{background:var(--accent-bg);border-color:var(--accent-line);color:#0C3A66}
  .bubble>:first-child{margin-top:0}
  .bubble>:last-child{margin-bottom:0}
  .bubble p{margin:.5em 0}
  .bubble h3,.bubble h4,.bubble h5{margin:.9em 0 .4em;font-size:15px;font-weight:500}
  .bubble ul{margin:.4em 0;padding-left:1.15em}
  .bubble li{margin:.2em 0}
  .bubble code{background:#F0F0EC;padding:1px 5px;border-radius:4px;font-size:13px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .bubble pre{background:#F4F4F1;border:1px solid var(--border);border-radius:8px;
    padding:11px;overflow-x:auto;margin:.6em 0}
  .bubble pre code{background:none;padding:0;font-size:12.5px;line-height:1.55}
  .bubble details{margin:.5em 0}
  .bubble summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
  .caret{display:inline-block;width:7px;height:16px;background:var(--accent);
    vertical-align:-3px;margin-left:2px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}

  .tool-note{
    display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--faint);
    padding-left:2px;
  }

  /* ---------- 开场 ---------- */
  #hero{max-width:820px;margin:0 auto 6px;padding:26px 0 4px}
  #hero h1{font-size:22px;font-weight:500;margin:0 0 6px;letter-spacing:-.02em}
  #hero p{margin:0 0 18px;color:var(--muted);font-size:14px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .card{
    text-align:left;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px;cursor:pointer;font:inherit;color:inherit;
  }
  .card:hover{border-color:var(--border-2);background:#FCFCFB}
  .card b{display:block;font-weight:500;font-size:14px;margin-bottom:3px}
  .card span{font-size:12.5px;color:var(--muted);line-height:1.5}

  /* ---------- 输入区 ---------- */
  footer{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--border);padding:12px 18px 14px}
  .foot-inner{max-width:820px;margin:0 auto}
  .modes{display:flex;gap:8px;margin-bottom:9px;flex-wrap:wrap;align-items:center}
  .tab{
    font:400 13px/1 inherit;padding:6px 13px;border-radius:999px;
    border:1px solid var(--border-2);background:transparent;color:var(--muted);cursor:pointer;
  }
  .tab.active{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent)}
  .hint{font-size:12px;color:var(--faint);margin-left:auto}
  .composer{display:flex;gap:10px;align-items:flex-end}
  textarea{
    flex:1;resize:none;min-height:46px;max-height:220px;padding:12px 13px;
    border:1px solid var(--border-2);border-radius:10px;background:var(--bg);
    font:400 14.5px/1.55 inherit;color:var(--text);outline:none;
  }
  textarea:focus{border-color:var(--accent);background:#fff}
  .send{height:46px;padding:0 20px;border-radius:10px;font-size:14px}
  .err{margin-top:9px;padding:9px 12px;background:var(--err-bg);color:var(--err);
    border:1px solid #F3C9C9;border-radius:8px;font-size:13px;display:none}
  .err.show{display:block}
  @media (max-width:600px){
    .sub{display:none}
    #hero h1{font-size:19px}
    .bubble{max-width:94%}
  }
</style>
</head>
<body>

<header>
  <div>
    <span class="brand">学术前沿知识导航</span>
    <span class="sub">从项目代码反推能力 · 定制科研学习路线</span>
  </div>
  <div class="spacer"></div>
  <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">未配置后端</span></div>
  <button class="btn" id="cfgBtn">设置</button>
</header>

<div id="setup">
  <div><b>先填后端地址</b>（就是你的云函数地址）。填完点保存，密钥保存在函数的环境变量里，不会进浏览器。</div>
  <div class="row">
    <input id="apiInput" placeholder="https://你的worker.workers.dev 或 https://xxx.vercel.app">
    <button class="btn primary" id="saveApi">保存并检测</button>
  </div>
</div>

<main id="main">
  <div class="wrap" id="msgs"></div>
  <div id="hero">
    <h1>把你做过的东西，变成看得见的能力清单</h1>
    <p>粘贴一段项目代码，或者直接说说你的方向，我会接着往下问。</p>
    <div class="cards">
      <button class="card" data-mode="analyze" data-fill="__example__"><b>反推我的能力</b><span>粘贴项目代码，输出带证据和置信度的知识点清单</span></button>
      <button class="card" data-mode="chat" data-fill="我想做多模态，但不知道具体往哪个方向走"><b>帮我定位方向</b><span>把模糊的兴趣收敛成具体的研究领域</span></button>
      <button class="card" data-mode="chat" data-fill="我是本科生，想在大三前进实验室做科研，现在该怎么安排"><b>规划学习路线</b><span>按你的现有基础和可投入时间排出阶段</span></button>
    </div>
  </div>
</main>

<footer>
  <div class="foot-inner">
    <div class="modes">
      <button class="tab active" data-mode="chat">通用对话</button>
      <button class="tab" data-mode="analyze">能力反推</button>
      <span class="hint" id="modeHint">Enter 发送 · Shift+Enter 换行</span>
    </div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="说点什么，或直接粘贴代码…"></textarea>
      <button class="btn primary send" id="sendBtn">发送</button>
    </div>
    <div class="err" id="err"></div>
  </div>
</footer>

<script>
(function(){
  'use strict';

  var STORE_KEY = 'academic-nav.api';
  var apiBase = localStorage.getItem(STORE_KEY) || '';
  var mode = 'chat';
  var history = [];       // [{role, content}]
  var busy = false;

  var $ = function(id){ return document.getElementById(id); };
  var msgs = $('msgs'), hero = $('hero'), main = $('main');
  var input = $('input'), sendBtn = $('sendBtn'), errBox = $('err');

  /* ==================== 极简 Markdown 渲染 ==================== */
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function inline(s){
    return s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  function renderText(t){
    var lines = esc(t).split('\n'), html = '', inList = false;
    function closeList(){ if(inList){ html += '</ul>'; inList = false; } }
    for (var i=0;i<lines.length;i++){
      var l = lines[i].trim();
      if (!l){ closeList(); continue; }
      var h = l.match(/^(#{1,4})\s+(.*)$/);
      if (h){ closeList(); var lv = Math.min(h[1].length + 2, 5);
        html += '<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>'; continue; }
      var li = l.match(/^(?:[-*]|\d+[.、])\s+(.*)$/);
      if (li){ if(!inList){ html += '<ul>'; inList = true; } html += '<li>' + inline(li[1]) + '</li>'; continue; }
      closeList();
      html += '<p>' + inline(l) + '</p>';
    }
    closeList();
    return html;
  }
  function renderMD(src){
    var parts = String(src).split('```'), out = '';
    for (var i=0;i<parts.length;i++){
      if (i % 2 === 1){
        out += '<pre><code>' + esc(parts[i].replace(/^[\w-]*\r?\n/, '')) + '</code></pre>';
      } else {
        out += renderText(parts[i]);
      }
    }
    return out;
  }

  /* ==================== 渲染消息 ==================== */
  function addMsg(role, text){
    hero.style.display = 'none';
    var row = document.createElement('div');
    row.className = 'msg ' + role;
    var b = document.createElement('div');
    b.className = 'bubble';
    b.innerHTML = role === 'user' ? esc(text).replace(/\n/g,'<br>') : renderMD(text);
    row.appendChild(b);
    msgs.appendChild(row);
    scrollDown();
    return b;
  }
  function scrollDown(){ main.scrollTop = main.scrollHeight; }

  function addNote(text){
    var n = document.createElement('div');
    n.className = 'tool-note';
    n.innerHTML = '<span class="dot on"></span>' + esc(text);
    msgs.appendChild(n);
    scrollDown();
    return n;
  }

  function showErr(msg){
    errBox.textContent = msg;
    errBox.classList.add('show');
  }
  function clearErr(){ errBox.classList.remove('show'); errBox.textContent = ''; }

  /* ==================== 状态指示 ==================== */
  function setStatus(state, text){
    var dot = $('dot');
    dot.className = 'dot' + (state === 'on' ? ' on' : state === 'off' ? ' off' : '');
    $('statusText').textContent = text;
  }

  async function checkHealth(){
    if (!apiBase){ setStatus('', '未配置后端'); $('setup').classList.add('show'); return; }
    setStatus('', '检测中…');
    try {
      var r = await fetch(apiBase.replace(/\/+$/,'') + '/api/health', { cache:'no-store' });
      var j = await r.json();
      if (j && j.ok && j.hasKey) setStatus('on', '已连接 · ' + (j.model || '模型'));
      else if (j && j.ok) { setStatus('off', '函数正常，但缺密钥'); showErr('函数已部署，但没有配置 MODEL_API_KEY 环境变量。'); }
      else setStatus('off', '后端异常');
    } catch(e){
      setStatus('off', '连不上后端');
      showErr('连不上后端地址：' + apiBase + '。检查地址是否正确、函数是否已部署。');
    }
  }

  /* ==================== 发送 ==================== */
  async function send(text){
    if (busy) return;
    text = (text || '').trim();
    if (!text) return;
    if (!apiBase){ $('setup').classList.add('show'); showErr('请先在上方填写后端地址。'); return; }

    clearErr();
    addMsg('user', text);
    history.push({ role:'user', content: text });
    input.value = ''; autosize();

    busy = true; sendBtn.disabled = true; sendBtn.textContent = '生成中';
    var label = mode === 'analyze' ? '正在反推能力…' : '正在思考…';
    var note = addNote(label);
    var bubble = addMsg('assistant', '');
    bubble.innerHTML = '<span class="caret"></span>';

    var full = '';
    try {
      var res = await fetch(apiBase.replace(/\/+$/,'') + '/api/chat', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ mode: mode, messages: history })
      });

      if (!res.ok){
        var msg = 'HTTP ' + res.status;
        try { var j = await res.json(); if (j && j.error) msg = j.error; } catch(e){}
        throw new Error(msg);
      }
      if (!res.body) throw new Error('当前浏览器不支持流式读取，请换 Chrome / Edge');

      var reader = res.body.getReader(), dec = new TextDecoder(), buf = '';
      while (true){
        var r = await reader.read();
        if (r.done) break;
        buf += dec.decode(r.value, { stream:true });
        var blocks = buf.split('\n\n');
        buf = blocks.pop();
        for (var i=0;i<blocks.length;i++){
          var lines = blocks[i].split('\n');
          for (var k=0;k<lines.length;k++){
            var line = lines[k];
            if (line.indexOf('data:') !== 0) continue;
            var data = line.slice(5).trim();
            if (!data || data === '[DONE]') continue;
            var ok = false, delta = '';
            try {
              var j2 = JSON.parse(data);
              delta = (j2.choices && j2.choices[0] && j2.choices[0].delta && j2.choices[0].delta.content) || '';
              ok = true;
            } catch(e){}
            if (ok && delta){
              full += delta;
              bubble.innerHTML = renderMD(full) + '<span class="caret"></span>';
              scrollDown();
            }
          }
        }
      }

      if (!full.trim()){
        bubble.innerHTML = '<p>没有收到内容。可能是模型返回为空，或密钥/额度有问题。</p>';
      } else {
        bubble.innerHTML = renderMD(full);
        history.push({ role:'assistant', content: full });
      }
      note.remove();
    } catch(e){
      note.remove();
      bubble.remove();
      showErr('调用失败：' + ((e && e.message) || e));
      history.pop();
    } finally {
      busy = false; sendBtn.disabled = false; sendBtn.textContent = '发送'; input.focus();
    }
  }

  /* ==================== 交互绑定 ==================== */
  function autosize(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 220) + 'px';
  }
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(input.value); }
  });
  sendBtn.addEventListener('click', function(){ send(input.value); });

  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
      t.classList.add('active');
      mode = t.dataset.mode;
      input.placeholder = mode === 'analyze'
        ? '把项目代码粘贴到这里（或贴文件树 / requirements.txt）…'
        : '说点什么…';
      $('modeHint').textContent = mode === 'analyze'
        ? '只依据代码中真实存在的证据反推 · Enter 发送'
        : 'Enter 发送 · Shift+Enter 换行';
    });
  });

  var EXAMPLE_CODE = [
    'import torch, torch.nn as nn',
    'class Net(nn.Module):',
    '    def __init__(self):',
    '        super().__init__()',
    '        self.conv1 = nn.Conv2d(1, 32, 3, padding=1)',
    '        self.fc = nn.Linear(32*28*28, 10)',
    '    def forward(self, x):',
    '        x = torch.relu(self.conv1(x))',
    '        return self.fc(x.flatten(1))',
    '',
    'model = Net().cuda()',
    'opt = torch.optim.Adam(model.parameters(), lr=1e-3)',
    'for epoch in range(10):',
    '    for x, y in train_loader:',
    '        loss = nn.functional.cross_entropy(model(x), y)',
    '        opt.zero_grad(); loss.backward(); opt.step()'
  ].join('\n');

  document.querySelectorAll('.card').forEach(function(c){
    c.addEventListener('click', function(){
      var m = c.dataset.mode || 'chat';
      var tab = document.querySelector('.tab[data-mode="' + m + '"]');
      if (tab) tab.click();
      if (c.dataset.fill === '__example__'){
        input.value = EXAMPLE_CODE;
        autosize();
        input.focus();
      } else {
        send(c.dataset.fill);
      }
    });
  });

  $('cfgBtn').addEventListener('click', function(){
    $('apiInput').value = apiBase;
    $('setup').classList.toggle('show');
  });
  $('saveApi').addEventListener('click', function(){
    var v = $('apiInput').value.trim().replace(/\/+$/,'');
    if (!v){ showErr('地址不能为空。'); return; }
    apiBase = v;
    localStorage.setItem(STORE_KEY, v);
    $('setup').classList.remove('show');
    clearErr();
    checkHealth();
  });

  /* ==================== 启动 ==================== */
  $('apiInput').value = apiBase;
  if (!apiBase) $('setup').classList.add('show');
  checkHealth();
  autosize();
})();
</script>
</body>
</html>
