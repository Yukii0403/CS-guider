# ============================================================
# Cloudflare Workers 部署配置
# ============================================================
# 用法：
#   cd web-demo
#   npx wrangler login          # 首次：浏览器授权（只需一次）
#   npx wrangler secret put MODEL_API_KEY   # 首次：粘贴 DeepSeek Key
#   npx wrangler deploy         # 每次部署
#
# 依赖：Node.js >= 18。wrangler 由 npx 自动下载，不需要预先安装，
#       也不需要往 package.json 里加任何依赖。
#
# 部署成功后你会得到：
#   https://academic-nav.<你的账号子域>.workers.dev
# 用浏览器访问 <该地址>/api/health 应返回 {"ok":true,...,"hasKey":true}
# ============================================================

name = "academic-nav"
main = "worker.js"

# Workers 运行时兼容日期。填一个过去的日期最稳妥——
# 填未来日期 wrangler 会直接报错。
compatibility_date = "2025-01-01"

# ------------------------------------------------------------
# 非敏感配置：直接写在这里，部署时自动注入成 Worker 的环境变量。
# 改完重新 deploy 即可生效。
# ------------------------------------------------------------
[vars]
MODEL_BASE_URL = "https://api.deepseek.com/v1"
MODEL_NAME = "deepseek-chat"

# 允许访问本接口的页面来源。
# 现在填 "*" 表示任何网站都能调用 —— 方便调试，但上线前建议改成你的页面地址，
# 否则别人可以拿你的接口地址白嫖你的模型额度。
ALLOW_ORIGIN = "*"

# ------------------------------------------------------------
# 敏感配置：API Key 绝对不要写进这个文件。
# 用 npx wrangler secret put MODEL_API_KEY 单独设置，
# 它会加密存储且永不出现在代码或仓库里。
# ------------------------------------------------------------
